[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexum"
version = "0.4.0"
description = "NEXUM local agentic AI assistant"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.9.0",
    "selenium>=4.20.0",
    "webdriver-manager>=4.0.2",
    "colorama>=0.4.6"
]

[project.scripts]
nexum = "nexum.cli:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["nexum*", "core*", "tools*"]
